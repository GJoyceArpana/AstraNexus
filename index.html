
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta name="theme-color" content="#080D1C" />

    <meta
        name="description"
        content="ASTRA NEXUS: MarsBase Mission. Become a junior astronaut, explore Jezero Crater, build a Mars outpost and discover real NASA science through interactive space adventures."
    />

    <meta name="author" content="ASTRA NEXUS Team" />

    <meta name="application-name" content="ASTRA NEXUS" />

    <title>ASTRA NEXUS | MarsBase Mission</title>

    <!-- ========================================= -->
    <!-- GOOGLE FONTS                              -->
    <!-- ========================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- ========================================= -->
    <!-- FAVICON                                   -->
    <!-- ========================================= -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="/favicon.svg"
    />

    <!-- ========================================= -->
    <!-- GLOBAL GAME STYLES                        -->
    <!-- ========================================= -->

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #080D1C;
            font-family: "Nunito", sans-serif;
            color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at 50% 45%,
                    #1B2945 0%,
                    #101A30 45%,
                    #080D1C 100%
                );
        }

        canvas {
            display: block;
            outline: none;
            image-rendering: auto;
        }

        button,
        input {
            font-family: "Nunito", sans-serif;
        }

        ::selection {
            background: #FF885E;
            color: #FFFFFF;
        }

        /* Prevent unwanted browser touch gestures */
        canvas {
            touch-action: none;
        }
    </style>
</head>

<body>

    <!-- ========================================= -->
    <!-- MAIN GAME CONTAINER                      -->
    <!-- ========================================= -->

    <main id="app" aria-label="ASTRA NEXUS MarsBase Mission">

        <!-- Phaser automatically inserts the game canvas here -->

    </main>

    <!-- ========================================= -->
    <!-- GAME ENTRY POINT                          -->
    <!-- ========================================= -->

    <script type="module" src="/src/main.ts"></script>

</body>

</html>
