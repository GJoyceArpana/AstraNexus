
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta name="theme-color" content="#080D1C" />

    <meta
        name="description"
        content="ASTRA NEXUS: MarsBase Mission. Become a junior astronaut, explore Jezero Crater, build a Mars outpost and discover real NASA science through interactive space adventures."
    />

    <meta name="author" content="ASTRA NEXUS Team" />

    <meta name="application-name" content="ASTRA NEXUS" />

    <title>ASTRA NEXUS | MarsBase Mission</title>

    <!-- ========================================= -->
    <!-- GOOGLE FONTS                              -->
    <!-- ========================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- ========================================= -->
    <!-- FAVICON                                   -->
    <!-- ========================================= -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="/favicon.svg"
    />

    <!-- ========================================= -->
    <!-- GLOBAL GAME STYLES                        -->
    <!-- ========================================= -->

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #15172D;
            font-family: "Nunito", sans-serif;
            color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            background: #15172D;
        }

        #fullscreen-btn {
            position: fixed;
            top: 14px;
            right: 18px;
            z-index: 99999;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(6, 21, 40, 0.92);
            border: 1.5px solid #00E5FF;
            border-radius: 8px;
            color: #00E5FF;
            font-family: "Orbitron", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.35);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            user-select: none;
        }

        #fullscreen-btn:hover {
            background: rgba(0, 229, 255, 0.24);
            color: #FFFFFF;
            border-color: #FFFFFF;
            box-shadow: 0 0 24px rgba(0, 229, 255, 0.7);
            transform: scale(1.04);
        }

        #fullscreen-btn:active {
            transform: scale(0.96);
        }

        canvas {
            display: block;
            outline: none;
            image-rendering: auto;
        }

        button,
        input {
            font-family: "Nunito", sans-serif;
        }

        ::selection {
            background: #FF885E;
            color: #FFFFFF;
        }

        /* Prevent unwanted browser touch gestures */
        canvas {
            touch-action: none;
        }
    </style>

</head>

<body>

    <!-- ========================================= -->
    <!-- GLOBAL FULLSCREEN TOGGLE BUTTON           -->
    <!-- ========================================= -->
    <button id="fullscreen-btn" type="button" aria-label="Toggle Fullscreen" title="Toggle Fullscreen (Hotkey: F)">
        <span id="fs-icon">⛶</span>
        <span id="fs-text">FULLSCREEN [F]</span>
    </button>

    <!-- ========================================= -->
    <!-- MAIN GAME CONTAINER                      -->
    <!-- ========================================= -->

    <main id="app" aria-label="ASTRA NEXUS MarsBase Mission">

        <!-- Phaser automatically inserts the game canvas here -->

    </main>

    <!-- ========================================= -->
    <!-- GAME ENTRY POINT                          -->
    <!-- ========================================= -->

    <script type="module" src="/src/main.ts"></script>

</body>

</html>
